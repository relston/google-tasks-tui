[package]
name = "google-tasks-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
getrandom = "0.2"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
toml = "0.8"
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2.5"
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
