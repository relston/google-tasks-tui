[package]
name = "google-tasks-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Terminal UI and scriptable CLI for Google Tasks"
license = "MIT"
repository = "https://github.com/relston/google-tasks-tui"
homepage = "https://ryanelston.com/google-tasks-tui/"
readme = "README.md"
keywords = ["google-tasks", "tui", "cli", "todo", "ratatui"]
categories = ["command-line-utilities"]
exclude = ["assets/*.gif", "assets/*.png", "docs/", ".github/", "packaging/"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.2"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
toml = "1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2.5"
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
