[package]
name = "omarchy-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.45"
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"
ureq = { version = "3.4.2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
